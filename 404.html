<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found | Joshua Steichen</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#141414;color:#f6f4ee;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center}
main{width:min(590px,calc(100% - 32px));padding:30px}
h1{font-size:clamp(36px,8vw,64px);font-weight:400;line-height:1.1}
p{color:#cfcac0}
a{color:#edc57f}
</style>
</head>
<body>
<main>
  <h1>Page not found.</h1>
  <p>This address may have changed. My cinematography, editing, and photography portfolio is available at the home page.</p>
  <p><a href="/">Visit Joshua Steichen's portfolio ↗</a></p>
  <p id="studio-link" hidden>Looking for Moonrise House? <a id="studio-target" href="https://www.moonrisehouse.com/">Visit the creative studio ↗</a></p>
</main>
<script>
(function(){
  var pathname=location.pathname;
  var businessPath=/^\/(?:moonrise-living|el-dogo-preview|healing-touch-preview|systems-plumbing-preview|hero-headquarters-preview|otra-preview|barkin-barbers-preview)(?:\/|$)/i.test(pathname);
  if(!businessPath)return;
  var destination="https://www.moonrisehouse.com"+pathname+location.search+location.hash;
  document.getElementById("studio-target").href=destination;
  document.getElementById("studio-link").hidden=false;
  location.replace(destination);
})();
</script>
</body></html>
